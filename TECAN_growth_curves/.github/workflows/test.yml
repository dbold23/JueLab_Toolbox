name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -r scripts/requirements.txt; fi
          pip install pytest

      - name: Unit, ingestion and parity tests
        run: python -m pytest tests -q --tb=short -p no:cacheprovider --ignore=tests/test_app_e2e.py --durations=10

      - name: Pipeline dry run
        run: python scripts/run_full_pipeline.py --dry-run --no-ml

      - name: App import check
        run: |
          python -c "import ast,sys; [ast.parse(open(p).read()) for p in sys.argv[1:]]" app/*.py app/views/*.py
          python -m tecan_growth.manual --check
